name: Release pushed XPI

# updateManifest.ts pushes one commit per published version (manifest.json +
# the new .xpi). This workflow does two independent things with it:
#
# - release: attach the XPI to a GitHub release named after the version, so
#   every published build is downloadable from Releases.
# - pages: publish the branch (manifest.json + all XPIs) to GitHub Pages,
#   which is where Firefox fetches updates from (update_link URLs).
#
# The jobs are independent on purpose: Pages is the critical path for
# updates, so a transient `gh release` failure must not block deployment.
# Re-runs and re-pushes are safe: existing releases are reused and assets
# are re-uploaded with --clobber; Pages deployments are serialized below.

on:
  push:
    branches: [manifest]
    paths: ['*.xpi']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release XPIs changed in this push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.xpi')
          if [ -z "$files" ]; then
            echo 'No XPI changed in this push, nothing to do.'
            exit 0
          fi
          echo "$files" | while IFS= read -r file; do
            [ -n "$file" ] || continue
            version=$(basename "$file" | sed -n 's/.*-\([0-9][0-9A-Za-z.\-]*\)\.xpi$/\1/p')
            if [ -z "$version" ]; then
              echo "::warning::Cannot parse version from $file, skipping."
              continue
            fi
            link=$(jq -r --arg v "$version" \
              '.addons[].updates[] | select(.version == $v) | .update_link' \
              manifest.json)
            notes="Signed Firefox build v$version."
            if [ -n "$link" ] && [ "$link" != 'null' ]; then
              notes="$notes"$'\n\n'"Update link: $link"
            fi
            if gh release view "$version" >/dev/null 2>&1; then
              echo "Release $version exists, re-uploading $file."
            else
              echo "Creating release $version with $file."
              gh release create "$version" --title "$version" --notes "$notes"
            fi
            gh release upload "$version" "$file" --clobber
          done

  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Stage site content
        run: |
          mkdir public
          cp manifest.json *.xpi public/
          ls public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
